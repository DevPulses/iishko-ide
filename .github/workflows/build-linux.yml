name: Build Linux AppImage

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fuse libfuse2 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build Contracts and Packages
        run: bun run build:contracts

      - name: Build Desktop and CLI
        run: bun run build:desktop

      - name: Package Linux Desktop (AppImage)
        env:
          IISHKO_BUILD_CUA_DRIVER: "0"
        run: bun run dist:desktop:linux

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iishko-ide-linux-appimage
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.tar.gz
            apps/desktop/dist-electron/*.zip
          if-no-files-found: warn
